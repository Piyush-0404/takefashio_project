$kind: http-request
url: "{{baseUrl}}/api/wishlist/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "productId": "{{productId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      if (body.item?.id) pm.collectionVariables.set('wishlistItemId', body.item.id);
    language: text/javascript
order: 6000
