$kind: http-request
url: "{{baseUrl}}/api/cart/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "productId": "{{productId}}",
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      if (body.item?.id) pm.collectionVariables.set('cartItemId', body.item.id);
order: 1000
